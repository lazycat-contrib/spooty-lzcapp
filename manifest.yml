lzc-sdk-version: "0.1"
name: Spooty
package: cloud.lazycat.app.spooty
version: 2.0.7
description: Spotify 下载器
homepage: https://github.com/Raiper34/spooty
author: Raiper34
application:
  subdomain: spooty
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  public_path:
    - /
  routes:
    - /=http://spooty:3000/
services:
  spooty:
    image: docker.hlmirror.com/raiper34/spooty:2.0.7
    binds:
      - /lzcapp/var/downloads:/spooty/backend/downloads
