application:
  subdomain: spooty
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://spooty:3000/

services:
  spooty:
    # upstream: raiper34/spooty:2.0.7
    image: docker.1ms.run/raiper34/spooty:2.0.7
    binds:
      - /lzcapp/var/downloads:/spooty/backend/downloads
